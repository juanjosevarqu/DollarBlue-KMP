name: Android CI

on:
  pull_request:
    branches: [ master, feature/action-build]

jobs:

  build_android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: gradle

      - name: Create local.properties
        run : |
          echo "ADMOB_ID=test" > ./local.properties
          echo "ADMOB_BANNER_ID=test" >> ./local.properties
          echo "ADMOB_REWARDED_ID=test" >> ./local.properties

      - name: Gradle permissions
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Generate BuildKonfig
        run: ./gradlew generateBuildKonfig

      - name: Unit tests
        run: ./gradlew :feature:calculator:testAndroidHostTest